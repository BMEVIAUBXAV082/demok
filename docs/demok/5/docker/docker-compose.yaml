version: "3"

# Week 05 – Orchestration demo környezet
# Szolgáltatások:
#   postgres    – Airflow metadata adatbázis
#   airflow-init – egyszer fut: DB migráció + admin user létrehozás
#   webserver   – Airflow UI (http://localhost:8080, admin/admin)
#   scheduler   – DAG fájlok feldolgozása, Run-ok indítása
#   jupyter     – interaktív Python notebookok (http://localhost:8888, token: demo)

services:

  postgres:
    image: postgres:15
    container_name: week05-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - week05_airflow_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-init:
    image: apache/airflow:2.9.1
    container_name: week05-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_EMAIL: admin@demo.com
      _AIRFLOW_WWW_USER_ROLE: Admin
    command: version
    restart: on-failure

  webserver:
    image: apache/airflow:2.9.1
    container_name: week05-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "week05-demo-secret"
    volumes:
      - ./dags:/opt/airflow/dags
      - week05_airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  scheduler:
    image: apache/airflow:2.9.1
    container_name: week05-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
      - week05_airflow_logs:/opt/airflow/logs
    command: scheduler

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: week05-jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: "demo"
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./dags:/home/jovyan/work/dags   # DAG fájlok elérhetők a notebookból is
    depends_on:
      - scheduler

volumes:
  week05_airflow_pgdata:
  week05_airflow_logs:
